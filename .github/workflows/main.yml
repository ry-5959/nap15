name: APK 만들기

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "apk/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 쪽잠 로직 테스트
        run: node tests/core.test.js

      - name: 화면(web) 파일을 앱 안으로 복사
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web

      - name: release APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK 이름 붙이기
        run: |
          TEAM=$(head -n 1 team-name.txt | sed 's/^\xEF\xBB\xBF//' | tr -d '\r\n ')
          if [ -z "$TEAM" ]; then TEAM=TEAM; fi
          mkdir -p apk
          rm -f apk/*.apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/${TEAM}_15분만_release.apk"
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk

      - name: 저장소 apk 폴더에 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk
          git diff --cached --quiet || git commit -m "APK 빌드 결과 올리기 [skip ci]"
          git push
